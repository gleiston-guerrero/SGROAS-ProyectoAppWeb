# Render Blueprint — SGROAS v1.0.0
# Uso: New + Blueprint + seleccionar el repositorio (rama main).
# Recrea: PostgreSQL managed, Redis y Web Service con health check.
databases:
  - name: sgroas-db
    databaseName: sgroas_db
    user: sgroas
    plan: free
    ipAllowList: []

services:
  - type: redis
    name: sgroas-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: sgroas-backend
    runtime: docker
    repo: https://github.com/Alxjandr07/SGROAS-ProyectoAppWeb
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PGHOST
        fromDatabase:
          name: sgroas-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: sgroas-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: sgroas-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: sgroas-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: sgroas-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: redis
          name: sgroas-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: redis
          name: sgroas-redis
          property: port
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "3600000"
      - key: APP_JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: APP_JWT_ISSUER
        value: "https://sgroas-backend.onrender.com"
      - key: APP_JWT_AUDIENCE
        value: "sgroas-frontend"
      # Correo (SMTP) para codigos de verificacion y restablecimiento.
      # Configurar los valores secretos en el dashboard de Render.
      # Ejemplo Gmail: SMTP_HOST=smtp.gmail.com + clave de aplicacion en SMTP_PASS.
      # Sin SMTP_HOST la app queda en MODO CONSOLA (el codigo se imprime en el log).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false